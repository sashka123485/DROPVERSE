services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dropverse
      POSTGRES_USER: dropverse
      POSTGRES_PASSWORD: dropverse
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropverse -d dropverse"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dropverse:dropverse@db:5432/dropverse
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app", "/app/node_modules"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_DEMO_MODE: "true"
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  postgres_data:
